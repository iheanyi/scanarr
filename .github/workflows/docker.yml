name: Docker

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  SECRET_KEY_BASE: scanarr-ci-secret-key-base-not-real-for-actions-only
  SCANARR_DATABASE_PASSWORD: scanarr_ci
  SCANARR_VERSION: ci

jobs:
  compose_smoke:
    name: Compose build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate Compose config
        run: docker compose config

      - name: Build app images
        run: docker compose build web sidekiq

      - name: Start web stack
        run: docker compose up -d postgres redis web

      - name: Wait for web health
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/up; then
              exit 0
            fi
            docker compose ps
            sleep 2
          done
          docker compose logs web
          exit 1

      - name: Stop stack
        if: always()
        run: docker compose down -v

  trivy_image_scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: compose_smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build image for scanning
        run: docker compose build web

      - name: Scan app image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scanarr:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ vars.TRIVY_BLOCKING == 'true' && '1' || '0' }}
