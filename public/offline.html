<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Scanarr - Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #f4f4f5;
        font-family: Geist, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .card {
        width: min(90vw, 420px);
        border: 1px solid #27272a;
        border-radius: 12px;
        padding: 20px;
        background: #18181b;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You're offline</h1>
      <p>Scanarr will keep available offline chapters readable. Reconnect to fetch new pages.</p>
    </main>
  </body>
</html>
