# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-performance
  - rubocop-minitest

# Exclude auto-generated files
AllCops:
  NewCops: enable
  Exclude:
    - "db/schema.rb"
    - "db/cache_schema.rb"
    - "db/queue_schema.rb"
    - "bin/*"
    - "vendor/**/*"
    - "node_modules/**/*"

# Temporarily disabled until codebase is fully migrated to omakase style
# TODO: Re-enable these rules and fix all violations
Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Layout/EmptyLinesAroundClassBody:
  Enabled: false

Layout/EmptyLinesAroundBlockBody:
  Enabled: false

# Minitest cops - some disabled until test files are cleaned up
# TODO: Enable these and fix violations
Minitest/MultipleAssertions:
  Enabled: false  # Many tests have >3 assertions

Minitest/EmptyLineBeforeAssertionMethods:
  Enabled: false  # Would require extensive test reformatting

Minitest/AssertPredicate:
  Enabled: false  # Style preference

Minitest/AssertOperator:
  Enabled: false  # Style preference

Minitest/AssertEmptyLiteral:
  Enabled: false  # Style preference
