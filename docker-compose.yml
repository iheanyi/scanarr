x-app: &app
  image: ${SCANARR_IMAGE:-scanarr}:${SCANARR_VERSION:-local}
  build: .

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    environment:
      POSTGRES_USER: scanarr
      POSTGRES_PASSWORD: ${SCANARR_DATABASE_PASSWORD:-scanarr}
      POSTGRES_DB: scanarr_production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanarr -d scanarr_production"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env with openssl rand -hex 64}
      DB_HOST: postgres
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SIDEKIQ_REDIS_URL: ${SIDEKIQ_REDIS_URL:-redis://redis:6379/1}
      ACTION_CABLE_REDIS_URL: ${ACTION_CABLE_REDIS_URL:-redis://redis:6379/2}
      REDIS_CACHE_NAMESPACE: scanarr:cache:production
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      APP_URL: ${APP_URL:-}
      APP_HOST: ${APP_HOST:-}
      APP_PROTOCOL: ${APP_PROTOCOL:-}
      APP_PORT: ${APP_PORT:-}
      RAILS_HOSTS: ${RAILS_HOSTS:-}
      RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-false}
      RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-false}
      ACTION_CABLE_ALLOWED_REQUEST_ORIGINS: ${ACTION_CABLE_ALLOWED_REQUEST_ORIGINS:-}
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}
      ACTIVE_STORAGE_LOCAL_ROOT: ${ACTIVE_STORAGE_LOCAL_ROOT:-/rails/storage}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SCANARR_DATABASE_PASSWORD: ${SCANARR_DATABASE_PASSWORD:-scanarr}
      SCANARR_DISABLE_AUTH: ${SCANARR_DISABLE_AUTH:-false}
    volumes:
      - storage_data:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  sidekiq:
    <<: *app
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env with openssl rand -hex 64}
      DB_HOST: postgres
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SIDEKIQ_REDIS_URL: ${SIDEKIQ_REDIS_URL:-redis://redis:6379/1}
      ACTION_CABLE_REDIS_URL: ${ACTION_CABLE_REDIS_URL:-redis://redis:6379/2}
      REDIS_CACHE_NAMESPACE: scanarr:cache:production
      SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-5}
      APP_URL: ${APP_URL:-}
      APP_HOST: ${APP_HOST:-}
      APP_PROTOCOL: ${APP_PROTOCOL:-}
      APP_PORT: ${APP_PORT:-}
      RAILS_HOSTS: ${RAILS_HOSTS:-}
      RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-false}
      RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-false}
      ACTION_CABLE_ALLOWED_REQUEST_ORIGINS: ${ACTION_CABLE_ALLOWED_REQUEST_ORIGINS:-}
      ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-local}
      ACTIVE_STORAGE_LOCAL_ROOT: ${ACTIVE_STORAGE_LOCAL_ROOT:-/rails/storage}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SCANARR_DATABASE_PASSWORD: ${SCANARR_DATABASE_PASSWORD:-scanarr}
    volumes:
      - storage_data:/rails/storage

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [ caddy ]
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}
      CADDY_PROXY_TARGET: ${CADDY_PROXY_TARGET:-web:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
    name: scanarr_postgres_data
  redis_data:
    name: scanarr_redis_data
  storage_data:
    name: scanarr_storage_data
  caddy_data:
    name: scanarr_caddy_data
  caddy_config:
    name: scanarr_caddy_config
