# SolidCable configuration - database-backed Action Cable adapter
# See: https://github.com/rails/solid_cable

development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.hour

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
