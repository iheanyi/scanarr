<% scanarr_storage_path = ENV.fetch("SCANARR_STORAGE_PATH", "scanarr_storage_data") %>
<% active_storage_service = ENV.fetch("ACTIVE_STORAGE_SERVICE", "local") %>

# Name of your application. Used to uniquely configure containers.
service: scanarr

# Name of the container image (use your-user/app-name on external registries).
image: scanarr

# Deploy to these servers.
servers:
  web:
    - 192.168.0.1
  job:
    hosts:
      - 192.168.0.1
    cmd: bundle exec sidekiq -C config/sidekiq.yml

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on
# a single web server. Change host to your public or internal domain.
# If used with Cloudflare, set encryption mode in SSL/TLS settings to "Full".
# Don't use this when deploying to multiple web servers; terminate SSL at your
# load balancer instead.
proxy:
  ssl: true
  host: scanarr.example.com
  app_port: 80
  healthcheck:
    path: /up

# Where you keep your container images.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: localhost:5555

  # Needed for authenticated registries.
  # username: your-user

  # Always use an access token rather than real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - SECRET_KEY_BASE
    - SCANARR_DATABASE_PASSWORD
<% if active_storage_service == "s3" %>
    - S3_ACCESS_KEY_ID
    - S3_SECRET_ACCESS_KEY
<% end %>
    # Optional only if you intentionally use Rails encrypted credentials.
    # - RAILS_MASTER_KEY
  clear:
    APP_URL: https://scanarr.example.com
    APP_HOST: scanarr.example.com
    APP_PROTOCOL: https
    RAILS_HOSTS: scanarr.example.com
    RAILS_ASSUME_SSL: true
    RAILS_FORCE_SSL: true

    # Default to Kamal redis accessory DNS name: <service>-<accessory>.
    # Override these URLs if you use an external Redis service.
    REDIS_URL: redis://scanarr-redis:6379/0
    SIDEKIQ_REDIS_URL: redis://scanarr-redis:6379/1
    ACTION_CABLE_REDIS_URL: redis://scanarr-redis:6379/2
    REDIS_CACHE_NAMESPACE: scanarr:cache:production

    # Set number of Sidekiq threads per worker process.
    # SIDEKIQ_CONCURRENCY: 5

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use scanarr-postgres for the postgres accessory on the same Kamal network.
    DB_HOST: scanarr-postgres

    ACTIVE_STORAGE_SERVICE: <%= active_storage_service %>
    SCANARR_STORAGE_ROOT: /rails/storage
    SCANARR_BACKUP_ROOT: /rails/storage/backups
    ACTIVE_STORAGE_LOCAL_ROOT: /rails/storage
    # For S3/R2/MinIO, set ACTIVE_STORAGE_SERVICE=s3 and provide:
    S3_ENDPOINT: <%= ENV.fetch("S3_ENDPOINT", "") %>
    S3_BUCKET: <%= ENV.fetch("S3_BUCKET", "") %>
    S3_REGION: <%= ENV.fetch("S3_REGION", "auto") %>
    S3_FORCE_PATH_STYLE: <%= ENV.fetch("S3_FORCE_PATH_STYLE", "true") %>

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for local Active Storage files.
# To use VPS block storage, mount it on the host and run Kamal commands with:
# SCANARR_STORAGE_PATH=/mnt/scanarr/storage bin/kamal deploy
volumes:
  - "<%= scanarr_storage_path %>:/rails/storage"


# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: 3.4.4
  # secrets:
  #   - GITHUB_TOKEN
  #   - SECRET_KEY_BASE

# Use a different ssh user than root
# ssh:
#   user: app

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  postgres:
    image: postgres:18-alpine
    host: 192.168.0.1
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: scanarr
        POSTGRES_DB: scanarr_production
      secret:
        - POSTGRES_PASSWORD
    files:
      - docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    directories:
      - scanarr_postgres_data:/var/lib/postgresql

  redis:
    image: valkey/valkey:8
    host: 192.168.0.1
    port: "127.0.0.1:6379:6379"
    directories:
      - scanarr_redis_data:/data
