# Single source of truth for source adapters.
#
# Each entry declares a source's identity, its adapter class, and an integer
# `version` (the Mihon extVersionCode analog). Bump `version` whenever an
# adapter's behavior changes (new domain, fixed selectors, changed parsing) so
# Sources::SyncService can record the update and reset health probation.
#
# Fields:
#   name:        Display name.
#   adapter:     Fully-qualified adapter class. Must inherit Scrapers::BaseAdapter.
#   version:     Integer >= 1. Bump on any behavior change.
#   base_url:    Canonical site URL. Operators can override HTTP tuning
#                (timeouts, delays, proxies) per-source in config/sources.yml.
#   source_type: "api" or "html".
#   priority:    Default ordering priority (lower wins).
#   enabled:     Default enabled state applied at creation. Sync never clobbers
#                an operator's later toggle, except when `dead: true`.
#   dead:        The site is gone for good. Force-disables the source on sync.
#   capabilities: Curation flags persisted to sources.capabilities (jsonb).
#
# Database rows are synced from this file by Sources::SyncService (db/seeds.rb
# runs it; it is idempotent). The adapter registry is built from this file.
api_version: 1
sources:
